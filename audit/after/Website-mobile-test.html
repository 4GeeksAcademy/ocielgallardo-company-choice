 de manera adecuada las funciones de accesibilidad correspondientes. [Obtén más información sobre los roles de ARIA y el elemento superior requerido](https://dequeuniversity.com/rules/axe/4.12/aria-required-parent).","score":null,"scoreDisplayMode":"notApplicable"},"aria-roles":{"id":"aria-roles","title":"Los valores de `[role]` son válidos","description":"Los roles de ARIA deben tener valores válidos para realizar las funciones de accesibilidad correspondientes. [Obtén más información sobre los roles de ARIA válidos](https://dequeuniversity.com/rules/axe/4.12/aria-roles).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"aria-text":{"id":"aria-text","title":"Los elementos con el atributo `role=text` no tienen descendientes enfocables.","description":"Si agregas `role=text` alrededor de un nodo de texto dividido por marcas, VoiceOver puede tratarlo como una frase, pero no se anunciarán los objetos descendentes enfocables del elemento. [Obtén más información sobre el atributo `role=text`](https://dequeuniversity.com/rules/axe/4.12/aria-text).","score":null,"scoreDisplayMode":"notApplicable"},"aria-toggle-field-name":{"id":"aria-toggle-field-name","title":"Los campos de activación de ARIA tienen nombres aptos para la accesibilidad","description":"Si un campo de activación no tiene un nombre de accesibilidad, los lectores de pantalla lo leerán en voz alta con un nombre genérico, por lo que resulta inservible para los usuarios que necesitan usar lectores de pantalla. [Obtén más información sobre los campos de activación](https://dequeuniversity.com/rules/axe/4.12/aria-toggle-field-name).","score":null,"scoreDisplayMode":"notApplicable"},"aria-tooltip-name":{"id":"aria-tooltip-name","title":"Los elementos `tooltip` de ARIA tienen nombres aptos para la accesibilidad","description":"Si un elemento de información sobre la herramienta no tiene un nombre de accesibilidad, los lectores de pantalla lo leerán en voz alta con un nombre genérico, por lo que resulta inservible para los usuarios que necesitan usar lectores de pantalla. [Obtén más información para nombrar elementos `tooltip` ](https://dequeuniversity.com/rules/axe/4.12/aria-tooltip-name).","score":null,"scoreDisplayMode":"notApplicable"},"aria-treeitem-name":{"id":"aria-treeitem-name","title":"Los elementos `treeitem` de ARIA tienen nombres aptos para la accesibilidad","description":"Si un elemento de `treeitem` no tiene un nombre de accesibilidad, los lectores de pantalla lo leerán en voz alta con un nombre genérico, por lo que resulta inservible para los usuarios que necesitan usar lectores de pantalla. [Obtén más información para etiquetar elementos `treeitem`](https://dequeuniversity.com/rules/axe/4.12/aria-treeitem-name).","score":null,"scoreDisplayMode":"notApplicable"},"aria-valid-attr-value":{"id":"aria-valid-attr-value","title":"Los atributos `[aria-*]` tienen valores válidos","description":"Las tecnologías de accesibilidad, como los lectores de pantalla, no pueden interpretar atributos de ARIA con valores no válidos. [Obtén más información sobre los valores válidos para los atributos de ARIA](https://dequeuniversity.com/rules/axe/4.12/aria-valid-attr-value).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"aria-valid-attr":{"id":"aria-valid-attr","title":"Los atributos `[aria-*]` son válidos y están bien escritos","description":"Las tecnologías de accesibilidad, como los lectores de pantalla, no pueden interpretar los atributos de ARIA con nombres no válidos. [Obtén más información sobre los atributos de ARIA válidos](https://dequeuniversity.com/rules/axe/4.12/aria-valid-attr).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"button-name":{"id":"button-name","title":"Los botones tienen nombres accesibles","description":"Si un botón no tiene un nombre de accesibilidad, los lectores de pantalla lo leerán en voz alta como \"botón\", por lo que resulta inservible para los usuarios que necesitan usar lectores de pantalla. [Obtén información para que los botones sean más accesibles](https://dequeuniversity.com/rules/axe/4.12/button-name).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"bypass":{"id":"bypass","title":"La página contiene un título, un vínculo de omisión o una región de punto de referencia","description":"Incluir maneras de omitir el contenido repetitivo permite a los usuarios que usan un teclado navegar por la página con mayor eficiencia. [Obtén más información sobre los bloqueos de omisiones](https://dequeuniversity.com/rules/axe/4.12/bypass).","score":null,"scoreDisplayMode":"notApplicable"},"color-contrast":{"id":"color-contrast","title":"Los colores de fondo y de primer plano tienen una relación de contraste adecuada","description":"Los textos con poco contraste resultan difíciles o imposibles de leer para muchos usuarios. [Obtén información para proporcionar suficiente contraste de color](https://dequeuniversity.com/rules/axe/4.12/color-contrast).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"definition-list":{"id":"definition-list","title":"Los elementos `\u003cdl>` contienen solo elementos `\u003cscript>`, `\u003ctemplate>` o `\u003cdiv>`, o grupos de `\u003cdt>` y `\u003cdd>` ordenados correctamente.","description":"Si las listas de definiciones no están bien marcadas, es posible que los lectores de pantalla las lean de forma confusa o imprecisa. [Obtén más información para estructurar las listas de definiciones correctamente](https://dequeuniversity.com/rules/axe/4.12/definition-list).","score":null,"scoreDisplayMode":"notApplicable"},"dlitem":{"id":"dlitem","title":"Los elementos de la lista de definiciones se incluyen en los elementos `\u003cdl>`","description":"Los elementos de la lista de definiciones (`\u003cdt>` y `\u003cdd>`) deben incluirse en un elemento `\u003cdl>` principal para garantizar que los lectores de pantalla los lean correctamente. [Obtén más información para estructurar las listas de definiciones correctamente](https://dequeuniversity.com/rules/axe/4.12/dlitem).","score":null,"scoreDisplayMode":"notApplicable"},"document-title":{"id":"document-title","title":"El documento tiene un elemento `\u003ctitle>`","description":"El título les brinda a los usuarios de lectores de pantalla una descripción general de la página. Por su parte, los usuarios de motores de búsqueda lo usan mucho para determinar si una página es relevante para su búsqueda. [Obtén más información sobre los títulos de documentos](https://dequeuniversity.com/rules/axe/4.12/document-title).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"duplicate-id-aria":{"id":"duplicate-id-aria","title":"Los ID de ARIA son únicos","description":"El valor de un ID de ARIA debe ser único para impedir que las tecnologías de accesibilidad omitan otras instancias. [Obtén información para corregir los IDs de ARIA duplicados](https://dequeuniversity.com/rules/axe/4.12/duplicate-id-aria).","score":null,"scoreDisplayMode":"notApplicable"},"empty-heading":{"id":"empty-heading","title":"Todos los elementos \u003cheading> incluyen contenido.","description":"Un encabezado sin contenido o con texto inaccesible impide que los usuarios de lectores de pantalla accedan a la información de la estructura de la página. [Obtén más información sobre los encabezados](https://dequeuniversity.com/rules/axe/4.12/empty-heading).","score":null,"scoreDisplayMode":"notApplicable"},"form-field-multiple-labels":{"id":"form-field-multiple-labels","title":"Ningún campo del formulario tiene varias etiquetas","description":"Las tecnologías de accesibilidad, como los lectores de pantalla, pueden tener dificultades para anunciar los campos de formulario con varias etiquetas, ya que usan la primera etiqueta, la última o todas. [Obtén más información para usar etiquetas de formularios](https://dequeuniversity.com/rules/axe/4.12/form-field-multiple-labels).","score":null,"scoreDisplayMode":"notApplicable"},"frame-title":{"id":"frame-title","title":"Los elementos `\u003cframe>` o `\u003ciframe>` tienen un título","description":"Los usuarios de lectores de pantalla necesitan que los marcos tengan títulos para que se describa su contenido. [Obtén más información sobre los títulos de los marcos](https://dequeuniversity.com/rules/axe/4.12/frame-title).","score":null,"scoreDisplayMode":"notApplicable"},"heading-order":{"id":"heading-order","title":"Los elementos de encabezado están ordenados en una secuencia descendente","description":"Los encabezados ordenados correctamente que no omiten niveles proporcionan la estructura semántica de la página, lo que facilita la navegación y comprensión cuando se usan tecnologías de accesibilidad. [Obtén más información sobre el orden de encabezados](https://dequeuniversity.com/rules/axe/4.12/heading-order).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"html-has-lang":{"id":"html-has-lang","title":"El elemento `\u003chtml>` tiene un atributo `[lang]`","description":"Si no se especifica ningún atributo `lang` para una página, los lectores de pantalla considerarán que la página está en el idioma predeterminado que el usuario eligió al configurar el lector de pantalla. Si el idioma de la página es diferente del predeterminado, es posible que el lector de pantalla no lea bien el texto de la página. [Obtén más información sobre el atributo `lang`](https://dequeuniversity.com/rules/axe/4.12/html-has-lang).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"html-lang-valid":{"id":"html-lang-valid","title":"El elemento `\u003chtml>` tiene un valor válido para su atributo `[lang]`","description":"Especificar un [idioma BCP 47](https://www.w3.org/International/questions/qa-choosing-language-tags#question) válido permite a los lectores de pantalla leer el texto en voz alta correctamente. [Obtén más información para usar el atributo `lang`](https://dequeuniversity.com/rules/axe/4.12/html-lang-valid).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"html-xml-lang-mismatch":{"id":"html-xml-lang-mismatch","title":"El elemento `\u003chtml>` tiene un atributo `[xml:lang]` con el mismo idioma base que el atributo `[lang]`.","description":"Si la página web no especifica un mismo idioma, es posible que el lector de pantalla no anuncie el texto de la página correctamente. [Obtén más información sobre el atributo `lang`](https://dequeuniversity.com/rules/axe/4.12/html-xml-lang-mismatch).","score":null,"scoreDisplayMode":"notApplicable"},"identical-links-same-purpose":{"id":"identical-links-same-purpose","title":"Los vínculos idénticos tienen el mismo propósito.","description":"Los vínculos con el mismo destino deben tener la misma descripción, para ayudar a los usuarios a comprender el propósito del vínculo y decidir si seguirlo o no. [Obtén más información sobre los vínculos idénticos](https://dequeuniversity.com/rules/axe/4.12/identical-links-same-purpose).","score":null,"scoreDisplayMode":"notApplicable"},"image-alt":{"id":"image-alt","title":"Los elementos de imagen tienen atributos `[alt]`","description":"El texto de los elementos informativos debe ser corto y descriptivo. Los elementos decorativos se pueden ignorar usando un atributo alt vacío. [Obtén más información sobre el atributo `alt`](https://dequeuniversity.com/rules/axe/4.12/image-alt).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"image-redundant-alt":{"id":"image-redundant-alt","title":"Los elementos de imagen no tienen atributos `[alt]` que sean texto redundante.","description":"El texto alternativo de los elementos informativos debe ser corto y descriptivo. El texto alternativo que es idéntico al texto junto al vínculo o la imagen puede resultar confuso para los usuarios de lectores de pantalla, ya que el texto se leerá dos veces. [Obtén más información sobre el atributo `alt`](https://dequeuniversity.com/rules/axe/4.12/image-redundant-alt).","score":null,"scoreDisplayMode":"notApplicable"},"input-button-name":{"id":"input-button-name","title":"Los botones de entrada tienen texto distinguible.","description":"Agregar texto distinguible y accesible a los botones de entrada puede ayudar a los usuarios de lectores de pantalla a comprender qué hace un botón. [Obtén más información sobre los botones de entrada](https://dequeuniversity.com/rules/axe/4.12/input-button-name).","score":null,"scoreDisplayMode":"notApplicable"},"input-image-alt":{"id":"input-image-alt","title":"Los elementos `\u003cinput type=\"image\">` tienen texto `[alt]`","description":"Cuando se usa una imagen como botón `\u003cinput>`, resulta útil proporcionar un texto alternativo para permitir que los usuarios de lectores de pantalla entiendan cuál es la función del botón. [Obtén información sobre el texto alternativo de la imagen de entrada](https://dequeuniversity.com/rules/axe/4.12/input-image-alt).","score":null,"scoreDisplayMode":"notApplicable"},"label-content-name-mismatch":{"id":"label-content-name-mismatch","title":"Los elementos con etiquetas de texto visibles tienen nombres de accesibilidad que coinciden.","description":"Las etiquetas de texto visible que no coinciden con el nombre de accesibilidad pueden generar una experiencia confusa para los usuarios de lectores de pantalla. [Obtén más información sobre los nombres de accesibilidad](https://dequeuniversity.com/rules/axe/4.12/label-content-name-mismatch).","score":null,"scoreDisplayMode":"notApplicable"},"label":{"id":"label","title":"Los elementos de formulario tienen etiquetas asociadas","description":"Las etiquetas garantizan que las tecnologías de accesibilidad, como los lectores de pantalla, lean los controles de los formularios de forma correcta. [Obtén más información sobre las etiquetas de elementos de formulario](https://dequeuniversity.com/rules/axe/4.12/label).","score":null,"scoreDisplayMode":"notApplicable"},"landmark-one-main":{"id":"landmark-one-main","title":"El documento tiene un punto de referencia principal.","description":"Un punto de referencia principal ayuda a los usuarios de lectores de pantalla a navegar por una página web. [Obtén más información sobre los puntos de referencia](https://dequeuniversity.com/rules/axe/4.12/landmark-one-main).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"link-name":{"id":"link-name","title":"Los vínculos tienen nombres reconocibles","description":"Usar textos de vínculo (y textos alternativos para las imágenes, si estas se usan como vínculos) que sean reconocibles y únicos, y que se puedan enfocar mejora la experiencia de navegación de los usuarios de lectores de pantalla. [Obtén información para mejorar la accesibilidad de los vínculos](https://dequeuniversity.com/rules/axe/4.12/link-name).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"link-in-text-block":{"id":"link-in-text-block","title":"Los vínculos no dependen del color para distinguirse.","description":"Los textos con poco contraste resultan difíciles o imposibles de leer para muchos usuarios. Los textos de vínculo que se pueden distinguir mejoran la experiencia de los usuarios con visión reducida. [Obtén más información para que se distingan los vínculos](https://dequeuniversity.com/rules/axe/4.12/link-in-text-block).","score":null,"scoreDisplayMode":"notApplicable"},"list":{"id":"list","title":"Las listas contienen solo elementos `\u003cli>` y elementos que admiten secuencias de comando (`\u003cscript>` y `\u003ctemplate>`).","description":"Los lectores de pantalla leen las listas en voz alta de una forma concreta. Se recomienda utilizar una estructura de lista adecuada para que los lectores de pantalla puedan leer las listas de forma correcta. [Obtén más información sobre la estructura de listas adecuada](https://dequeuniversity.com/rules/axe/4.12/list).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos con errores"}],"items":[]}},"listitem":{"id":"listitem","title":"Los elementos de lista (`\u003cli>`) se incluyen en los elementos superiores `\u003cul>`, `\u003col>` o `\u003cmenu>`","description":"Los
