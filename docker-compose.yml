# Production stack (default). Hot-reload dev overlay: docker-compose.dev.yml
services:
  redis:
    image: redis:7-alpine
    container_name: healthcore-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - healthcore_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: healthcore-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    # The qdrant image ships no curl/wget; probe /readyz over bash's /dev/tcp.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.1 200\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - healthcore_net

  uis:
    build:
      context: .
      dockerfile: uis/Dockerfile.prod
      args:
        NEXT_PUBLIC_HEALTHCORE_API_URL: ${NEXT_PUBLIC_HEALTHCORE_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_TRACKER_API_URL: ${NEXT_PUBLIC_TRACKER_API_URL:-https://playground.4geeks.com/tracker/api/v1}
        NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-http://localhost:8000/telemetry/events}
    container_name: healthcore-uis
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - healthcore_net

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile.prod
    container_name: healthcore-backend
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/packages/shared
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3001}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_DB_SSLMODE: ${SUPABASE_DB_SSLMODE:-}
      EMAIL_SSL_VERIFY: ${EMAIL_SSL_VERIFY:-true}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      RAG_COLLECTION: ${RAG_COLLECTION:-healthcore_knowledge}
      AGENT_TOOL_API_URL: ${AGENT_TOOL_API_URL:-http://127.0.0.1:8000}
      AGENT_TOOL_CLIENT_ID: ${AGENT_TOOL_CLIENT_ID:-}
      AGENT_TOOL_CLIENT_SECRET: ${AGENT_TOOL_CLIENT_SECRET:-}
      AGENT_TOOL_CLIENT_SECRET_FILE: ${AGENT_TOOL_CLIENT_SECRET_FILE:-}
      SERVICE_TOKEN_EXPIRE_MINUTES: ${SERVICE_TOKEN_EXPIRE_MINUTES:-15}
      # MCP is the agent's only path to the incidents/inventory server (hito 25);
      # a failing hop surfaces an honest `unavailable` answer, never a fallback.
      MCP_SERVER_URL: http://mcp:8100/mcp
      MCP_TOOL_TIMEOUT_SECONDS: ${MCP_TOOL_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    # LangGraph SqliteSaver for RFP HITL — must match worker mount so resume
    # on the API sees interrupts created by rfp.approval_run (or sync start).
    volumes:
      - rfp_langgraph_checkpoints:/app/data/process/rfp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - healthcore_net

  # MCP server: OAuth-protected resource exposing the incident/inventory tools.
  # Same image as the backend; it reaches the API over the compose network with
  # its own service identity (MCP_BACKEND_CLIENT_ID / MCP_BACKEND_CLIENT_SECRET).
  # In-network URLs are literals: inside a container localhost is the container.
  mcp:
    build:
      context: .
      dockerfile: services/Dockerfile.prod
    container_name: healthcore-mcp
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/packages/shared
      MCP_AUTH_ISSUER_URL: http://backend:8000
      # Discovery (fetched in-network) advertises the public issuer's
      # localhost JWKS URL, which this container cannot resolve. Tokens keep
      # `iss` = the public issuer; only the JWKS fetch is pointed in-network.
      MCP_AUTH_JWKS_URI: http://backend:8000/.well-known/jwks.json
      # Resource identifier = token `aud` + advertised metadata URL. Read from
      # .env so the agent (backend service) and this server agree on it; set it
      # to the public Codespaces URL for the MCP Playground validation.
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost:8100/mcp}
      MCP_BACKEND_URL: http://backend:8000
    command:
      [
        "uvicorn",
        "incidents_inventory_mcp.app:app",
        "--app-dir",
        "/app/mcps/incidents-inventory-mcp",
        "--host",
        "0.0.0.0",
        "--port",
        "8100",
      ]
    ports:
      - "8100:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - healthcore_net

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile.prod
    container_name: healthcore-worker
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/packages/shared
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_DB_SSLMODE: ${SUPABASE_DB_SSLMODE:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      RAG_COLLECTION: ${RAG_COLLECTION:-healthcore_knowledge}
    command: ["celery", "-A", "services.app.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    volumes:
      - rfp_langgraph_checkpoints:/app/data/process/rfp
    depends_on:
      - redis
    networks:
      - healthcore_net

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile.prod
    container_name: healthcore-flower
    working_dir: /app
    environment:
      PYTHONPATH: /app:/app/packages/shared
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["celery", "-A", "services.app.tasks.celery_app:celery_app", "flower", "--port=5555"]
    depends_on:
      - redis
    ports:
      - "5555:5555"
    networks:
      - healthcore_net

volumes:
  qdrant_storage:
  rfp_langgraph_checkpoints:

networks:
  healthcore_net:
    name: healthcore_dev_network
