services:
  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: healthcore-uis
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_HEALTHCORE_API_URL: ${NEXT_PUBLIC_HEALTHCORE_API_URL}
      NEXT_PUBLIC_TRACKER_API_URL: ${NEXT_PUBLIC_TRACKER_API_URL}
    command: >
      sh -c "
      cd /app/uis/backoffice && npm install &&
      cd /app/uis/website && npm install &&
      (cd /app/uis/backoffice && HOSTNAME=0.0.0.0 PORT=3000 npm run dev) &
      (cd /app/uis/website && HOSTNAME=0.0.0.0 PORT=3001 npm run dev) &
      wait
      "
    volumes:
      - ./uis:/app/uis
      - ./src:/app/src
      - uis_backoffice_node_modules:/app/uis/backoffice/node_modules
      - uis_website_node_modules:/app/uis/website/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - healthcore_net

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: healthcore-backend
    env_file:
      - .env
    environment:
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SUPABASE_DB_SSLMODE: ${SUPABASE_DB_SSLMODE}
    command: uvicorn services.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    networks:
      - healthcore_net

networks:
  healthcore_net:
    name: healthcore_dev_network

volumes:
  uis_backoffice_node_modules:
  uis_website_node_modules:
