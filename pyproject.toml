[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "healthcore-monorepo"
version = "0.1.0"
description = "HealthCore monorepo Python tooling"
requires-python = ">=3.12"
dependencies = [
  "bcrypt==4.0.1",
  "certifi>=2026.7.22",
  "email-validator>=2.3.0",
  "fastapi>=0.141.1",
  "passlib[bcrypt]>=1.7.4",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "tinydb>=4.8.2",
  "uvicorn>=0.52.1",
]

[project.scripts]
seed = "services.app.core.seed:run_seed"
seed-incidents = "scripts.seed_incidents:main"

[tool.hatch.build]
dev-mode-dirs = [".", "packages/shared"]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.hatch.build.targets.wheel.force-include]
"packages/shared/healthcore_shared" = "healthcore_shared"
