[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "healthcore-monorepo"
version = "0.1.0"
description = "HealthCore monorepo Python tooling"
requires-python = ">=3.12"
dependencies = [
  "email-validator>=2.3.0",
  "fastapi>=0.141.1",
  "pydantic>=2.13.4",
  "python-multipart>=0.0.32",
  "tinydb>=4.8.2",
  "uvicorn>=0.52.1",
]

[project.scripts]
seed = "services.api.seed:run_seed"

[tool.hatch.build.targets.wheel]
packages = ["services"]