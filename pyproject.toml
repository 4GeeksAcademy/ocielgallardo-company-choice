[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "healthcore-monorepo"
version = "0.1.0"
description = "HealthCore monorepo Python tooling"
requires-python = ">=3.12"
dependencies = [
  "bcrypt==4.0.1",
  "celery[redis]>=5.5",
  "certifi>=2026.7.22",
  "email-validator>=2.3.0",
  "fastapi>=0.141.1",
  "flower>=2.0",
  "groq>=1.7.0",
  "httpx>=0.28.1",
  "langchain-mcp-adapters>=0.3.2",
  "langgraph>=1.2.14",
  "langsmith>=0.3.45,<0.4",
  "markitdown[pdf]>=0.1.8",
  "matplotlib>=3.11.2",
  "mcp>=1.24,<2",
  "mcpauth==0.2.0b1",
  "openai>=3.26.1",
  "pandas>=2.2",
  "passlib[bcrypt]>=1.7.4",
  "prefect>=3",
  "psycopg2-binary>=2.9.12",
  "py-readability-metrics>=1.4.5",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "qdrant-client>=1.19.1",
  "scikit-learn>=1.9.1",
  "sqlmodel>=0.0.39",
  "tinydb>=4.8.2",
  "uvicorn>=0.52.1",
]

[project.scripts]
seed = "services.app.core.seed:run_seed"
seed-inventory = "services.app.core.inventory_seed:run_inventory_seed"
seed-inventory-volume = "scripts.seed_inventory_volume:main"
seed-incidents = "scripts.seed_incidents:main"

[tool.hatch.build]
dev-mode-dirs = [".", "packages/shared"]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.hatch.build.targets.wheel.force-include]
"packages/shared/healthcore_shared" = "healthcore_shared"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
