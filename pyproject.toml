[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "healthcore-monorepo"
version = "0.1.0"
description = "HealthCore monorepo Python tooling"
requires-python = ">=3.12"
dependencies = [
  "bcrypt==4.0.1",
  "email-validator>=2.3.0",
  "fastapi>=0.141.1",
  "passlib[bcrypt]>=1.7.4",
  "psycopg2-binary>=2.9.12",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "sqlmodel>=0.0.39",
  "tinydb>=4.8.2",
  "uvicorn>=0.52.1",
]

[project.scripts]
seed = "services.app.core.seed:run_seed"
seed-inventory = "services.app.core.inventory_seed:run_inventory_seed"

[tool.hatch.build.targets.wheel]
packages = ["services"]
